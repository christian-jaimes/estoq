<!-- @dsCard group="Navigation" height=110 subtitle="Search | 4 shortcuts | theme toggle, notifications" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0} .stage{padding:24px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;background:var(--bg);box-sizing:border-box}</style></head>
<body class="eq-root">
<div class="stage" style="display:block">
<header class="eq-topbar" style="border:1px solid var(--border);border-radius:var(--radius-lg)">
 <label class="eq-input eq-topbar__search"><span class="eq-icon">search</span><input placeholder="Search products, SKUs or barcodes"></label>
 <span class="eq-topbar__sep" role="separator" aria-orientation="vertical"></span>
 <div class="eq-topbar__actions" role="group" aria-label="Shortcuts">
  <button class="eq-icon-btn eq-icon-btn--round" aria-label="Point of sale" title="Point of sale (F1)"><span class="eq-icon">point_of_sale</span></button>
  <button class="eq-icon-btn eq-icon-btn--round" aria-label="Add / receive product" title="Add / receive product (F2)"><span class="eq-icon">add_box</span></button>
  <button class="eq-icon-btn eq-icon-btn--round" aria-label="Stock adjustment" title="Stock adjustment (F3)"><span class="eq-icon">tune</span></button>
  <button class="eq-icon-btn eq-icon-btn--round" aria-label="Return" title="Return (F4)"><span class="eq-icon">assignment_return</span></button>
 </div>
 <span class="eq-topbar__sep" role="separator" aria-orientation="vertical"></span>
 <button class="eq-icon-btn eq-theme-toggle" id="theme" aria-label="Switch theme" title="Switch theme"><span class="eq-icon eq-theme-toggle__moon">dark_mode</span><span class="eq-icon eq-theme-toggle__sun">light_mode</span></button>
 <button class="eq-icon-btn" aria-label="Notifications"><span class="eq-icon">notifications</span><span class="eq-icon-btn__dot"></span></button>
</header></div>
<script>(function(){var R=document.documentElement,b=document.getElementById('theme');
function label(){var d=R.getAttribute('data-theme')==='dark';b.setAttribute('aria-label',d?'Switch to light theme':'Switch to dark theme');b.title=b.getAttribute('aria-label');}
b.addEventListener('click',function(){R.setAttribute('data-theme',R.getAttribute('data-theme')==='dark'?'light':'dark');label();});label();})();</script>
</body></html>
