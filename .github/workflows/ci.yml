name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: WinUI app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build src/estoq.App/estoq.App.csproj --configuration Release -p:Platform=x64
